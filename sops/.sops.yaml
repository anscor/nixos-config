keys:
  - &tencent age15sthh2kl3jkpltaq9kuufstjfkcxhh3de0v4nr2qrav4z8676qzq5tlr0n
  - &aiagent age187lfdh66jx5fgu2hcvz58jmjf8j8lzyysxrhz3zx4j0hly9w8p2qlfx8h3
creation_rules:
  # 共享：两台机器都能解密（如 anscor_authkey）
  - path_regex: secrets/shared/
    key_groups:
      - age:
          - *tencent
          - *aiagent

  # 用户级：两台机器上都存在的用户
  - path_regex: secrets/users/anscor/
    key_groups:
      - age:
          - *tencent
          - *aiagent

  # 主机隔离：只有该主机自己能解密
  - path_regex: secrets/hosts/aiagent/
    key_groups:
      - age:
          - *aiagent
  - path_regex: secrets/hosts/tencent/
    key_groups:
      - age:
          - *tencent
